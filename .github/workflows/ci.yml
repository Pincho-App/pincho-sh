name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-posix:
    name: Test (POSIX sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash
      - name: Run tests with dash
        run: dash tests/test.sh

  test-bash:
    name: Test (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with bash
        run: bash tests/test.sh

  notify:
    name: Notify release
    runs-on: ubuntu-latest
    needs: [test-posix, test-bash]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Send release notification
        run: |
          curl -s -X POST "https://api.pincho.app/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.PINCHO_TOKEN }}" \
            -d "{\"title\":\"Shell SDK ${GITHUB_REF_NAME} Released\",\"message\":\"Pincho Shell Scripts ${GITHUB_REF_NAME} has been released.\",\"type\":\"release\",\"tags\":[\"shell\",\"sdk\",\"release\"]}"
