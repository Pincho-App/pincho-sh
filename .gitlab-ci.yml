stages:
  - test
  - notify

variables:
  GIT_DEPTH: 1

# Test with POSIX sh (dash)
test:posix:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y curl dash
  script:
    - dash tests/test.sh
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Test with Bash
test:bash:
  stage: test
  image: bash:5
  before_script:
    - apk add --no-cache curl
  script:
    - bash tests/test.sh
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Notify on release
notify:pincho:
  stage: notify
  image: curlimages/curl:latest
  needs: [test:posix, test:bash]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+)?$/
  script:
    - |
      curl -s -X POST "https://api.pincho.app/send" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${PINCHO_RELEASE_TOKEN}" \
        -d "{\"title\":\"Shell SDK ${CI_COMMIT_TAG} Released\",\"message\":\"Pincho Shell Scripts ${CI_COMMIT_TAG} has been released.\",\"type\":\"release\",\"tags\":[\"shell\",\"sdk\",\"release\"]}"
